[project]
name = "image-gen"
version = "0.1.0"
description = "CLI tool for SDXL image generation with safetensors models, LoRA and embedding support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "diffusers>=0.36.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "safetensors>=0.4.0",
    "typer>=0.12.0",
    "Pillow>=10.0.0",
    "accelerate>=0.28.0",
    "omegaconf>=2.3.0",
    "peft>=0.10.0",
    "compel>=2.0.0",
    "piexif>=1.1.3",
    "PyYAML>=6.0",
    # video-gen (image-to-video): encoding + backend tokenizers
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.1",
    "sentencepiece>=0.2.0",
    "ftfy>=6.2.0",
    # generate-similar --vary (LLM prompt variation, OpenAI-compatible API)
    "openai>=1.0.0",
]

[project.scripts]
image-gen = "image_gen.cli:app"
video-gen = "video_gen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_gen", "src/video_gen"]

[tool.hatch.build.targets.sdist]
include = ["src/image_gen", "src/video_gen"]

[tool.coverage.report]
fail_under = 80

[tool.bandit]
# B311 (random module): this tool uses `random` exclusively for generative-art
# seeds and prompt-variable draws (image-gen/video-gen), never for anything
# security- or crypto-sensitive. Flagging every call site individually would
# just be noise; skip the check project-wide instead.
skips = ["B311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Warnings filters / logging levels / env vars must be set before importing
# heavy ML libs (torch, typer, transformers) to suppress their startup noise.
"src/image_gen/cli.py" = ["E402"]
"src/image_gen/prompt_encoding.py" = ["E402"]
"src/video_gen/cli.py" = ["E402"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.0",
    "bandit>=1.7.0",
]
